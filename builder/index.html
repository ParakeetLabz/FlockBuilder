<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlockBuilder Studio — build a game with no code</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020617; color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid #1e293b;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; }
  header h1 span { color: #22d3ee; }
  header .sub { color: #64748b; font-size: 13px; }
  header .spacer { flex: 1; }
  #save-state { color: #475569; font-size: 13px; min-width: 70px; text-align: right; }
  #save-state.flash { color: #4ade80; }
  button {
    font-family: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    padding: 8px 14px; font-size: 14px;
  }
  button:hover { border-color: #22d3ee; }
  button:disabled { opacity: 0.4; cursor: default; }
  #play-btn {
    background: #22d3ee; border-color: #22d3ee; color: #020617;
    font-weight: 700; font-size: 15px; padding: 9px 26px;
  }
  #play-btn:hover { background: #67e8f9; }
  #play-btn.stop { background: #f87171; border-color: #f87171; }
  #play-btn.stop:hover { background: #fca5a5; }
  main { display: flex; flex: 1; min-height: 0; }
  #toolbar {
    width: 140px; padding: 14px 10px; border-right: 1px solid #1e293b;
    display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
  }
  #toolbar button {
    display: flex; align-items: center; gap: 8px;
    text-align: left; font-size: 12.5px; padding: 8px 9px;
  }
  #toolbar button .dot {
    width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0;
  }
  #toolbar button.active { border-color: #22d3ee; background: #164e63; }
  #tool-desc { font-size: 11px; color: #64748b; margin-top: 4px; line-height: 1.4; }
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #room-tabs {
    display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; align-items: center;
  }
  .theme-wrap { margin-left: auto; padding-bottom: 8px; }
  .theme-sel {
    background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
    border-radius: 8px; padding: 6px 8px; font-size: 13px;
  }
  .room-tab {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 12px; border-radius: 8px 8px 0 0;
    border-bottom: none;
  }
  .room-tab.active { border-color: #22d3ee; background: #0f172a; color: #22d3ee; font-weight: 600; }
  .room-tab .room-x {
    color: #64748b; font-size: 15px; line-height: 1; padding: 0 2px;
  }
  .room-tab .room-x:hover { color: #f87171; }
  .room-tab.add { border-style: dashed; color: #64748b; }
  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 14px 18px 18px; position: relative; min-width: 0; min-height: 0;
  }
  #board-wrap { position: relative; max-width: 100%; }
  canvas {
    border-radius: 12px; border: 1px solid #1e293b;
    box-shadow: 0 0 60px rgba(34, 211, 238, 0.08);
    max-width: 100%; max-height: calc(100vh - 270px);
    touch-action: none; cursor: crosshair; display: block;
    background: #0b1020;
  }
  #mode-banner {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(34, 211, 238, 0.92); color: #020617;
    font-weight: 700; font-size: 13px; padding: 6px 16px; border-radius: 20px;
    display: none; pointer-events: none; white-space: nowrap;
  }
  body.playing #mode-banner { display: block; }
  body.playing #toolbar, body.playing #props, body.playing #room-tabs { opacity: 0.35; pointer-events: none; }
  body.playing canvas { cursor: default; }
  #props {
    width: 230px; padding: 16px 14px; border-left: 1px solid #1e293b;
    overflow-y: auto;
  }
  #props h2 { font-size: 15px; margin-bottom: 10px; }
  #props h3 { font-size: 16px; color: #22d3ee; text-transform: capitalize; margin-bottom: 2px; }
  #props .muted { color: #64748b; font-size: 13px; }
  #props .small { font-size: 12px; margin-bottom: 12px; }
  #props label { display: block; font-size: 13px; margin: 10px 0 4px; color: #94a3b8; }
  #props .row { display: flex; gap: 8px; }
  #props .row label { flex: 1; }
  #props input[type="number"], #props input[type="text"], #props select {
    width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
    border-radius: 6px; padding: 6px 8px; font-size: 13px; margin-top: 2px;
  }
  #props input[type="color"] { width: 100%; height: 36px; border: none; background: none; cursor: pointer; padding: 0; }
  #props input[type="range"] { width: 100%; margin-top: 4px; accent-color: #22d3ee; }
  #props .danger {
    margin-top: 16px; width: 100%; border-color: #7f1d1d; color: #fca5a5;
  }
  #props .danger:hover { border-color: #ef4444; background: #450a0a; }
  #props .check { display: flex; align-items: center; gap: 8px; }
  #props .check input { width: auto; }
  #rules-wrap { margin-top: 14px; border-top: 1px solid #1e293b; padding-top: 10px; }
  #rules-wrap h4 { font-size: 14px; color: #38bdf8; margin-bottom: 8px; }
  .rule {
    background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
    padding: 8px; margin-bottom: 8px; position: relative;
  }
  .rule-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: #94a3b8; flex-wrap: wrap; }
  .rule-row:last-of-type { margin-bottom: 0; }
  .rule-row b { color: #e2e8f0; font-size: 11px; }
  .rule select, .rule input[type="number"], .rule input[type="text"] {
    background: #020617; border: 1px solid #334155; color: #e2e8f0;
    border-radius: 6px; padding: 4px 6px; font-size: 12px;
  }
  .rule input[type="number"] { width: 62px; }
  .rule .rule-x {
    position: absolute; top: 2px; right: 4px; border: none; background: none;
    color: #64748b; font-size: 16px; padding: 2px 6px;
  }
  .rule .rule-x:hover { color: #f87171; }
  #rule-add { width: 100%; margin-top: 4px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 8px; }
  .tabbtn { flex: 1; font-size: 12px; padding: 6px 8px; }
  .tabbtn.active { border-color: #38bdf8; color: #38bdf8; }
  #plc-text {
    width: 100%; background: #020617; border: 1px solid #334155; color: #a5f3fc;
    border-radius: 8px; padding: 8px; font-family: ui-monospace, monospace; font-size: 12px;
    resize: vertical; margin-bottom: 8px;
  }
  .plc-err { color: #fca5a5; font-size: 12px; margin-top: 6px; }
  #props code { color: #67e8f9; font-size: 11px; }
  #btn-debug.on { border-color: #4ade80; color: #4ade80; }
  .modal-back {
    position: fixed; inset: 0; background: rgba(2,6,23,0.7);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-wrap { position: relative; width: min(560px, 92vw); max-height: 88vh; overflow-y: auto; }
  .modal {
    background: #0f172a; border: 1px solid #334155; border-radius: 14px;
    padding: 20px;
  }
  .modal h2 { font-size: 18px; margin-bottom: 6px; }
  .modal .muted { color: #64748b; font-size: 13px; margin-bottom: 12px; }
  .modal .small { font-size: 12px; }
  .modal-x {
    position: absolute; top: -14px; right: -14px; width: 34px; height: 34px;
    border-radius: 50%; background: #1e293b; border: 1px solid #334155;
    color: #e2e8f0; font-size: 18px; z-index: 1;
  }
  .prefab-row {
    display: flex; align-items: center; gap: 8px; padding: 8px;
    border: 1px solid #1e293b; border-radius: 8px; margin-bottom: 6px;
  }
  .prefab-row .dot { width: 12px; height: 12px; border-radius: 4px; }
  .prefab-row .spacer { flex: 1; }
  .prefab-row button { font-size: 12px; padding: 5px 10px; }
  .modal .row { display: flex; gap: 8px; align-items: center; }
  .modal input[type="text"] {
    background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .modal input[type="range"] { width: 100%; accent-color: #22d3ee; }
  .modal select {
    background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }
  .modal input[type="color"] { width: 48px; height: 30px; border: none; background: none; padding: 0; cursor: pointer; }
  #fx-controls label { display: block; font-size: 13px; color: #94a3b8; margin: 8px 0; }
  #fx-controls .row label { display: flex; align-items: center; gap: 6px; margin: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .back { color: #22d3ee; text-decoration: none; font-size: 13px; }
  .back:hover { text-decoration: underline; }
  @media (max-width: 900px) {
    #props { display: none; }
    #toolbar { width: 108px; }
  }
</style>
</head>
<body>
  <header>
    <h1>🐦 Flock<span>Builder</span> Studio</h1>
    <span class="sub">build a game with zero code</span>
    <span class="spacer"></span>
    <span id="obj-count" class="sub"></span>
    <span id="save-state"></span>
    <div class="actions">
      <button id="btn-sample" title="Load an example game (2 rooms)">Sample</button>
      <button id="btn-prefabs" title="Reusable object prefabs">Prefabs</button>
      <button id="btn-fx" title="Design particle effects">FX</button>
      <button id="btn-debug" title="Show the debug overlay while playing">Debug</button>
      <button id="btn-export" title="Download this game as JSON">Export</button>
      <button id="btn-import" title="Load a game from a JSON file">Import</button>
      <button id="btn-clear" title="Remove everything in this room">Clear</button>
      <button id="btn-publish" title="Download a standalone HTML5 game file">Publish</button>
    </div>
    <button id="play-btn">▶ Play</button>
  </header>
  <main>
    <aside id="toolbar">
      <button data-tool="select" class="active">✋ Select</button>
      <button data-tool="player"><span class="dot" style="background:#22d3ee"></span>Player</button>
      <button data-tool="wall"><span class="dot" style="background:#475569"></span>Wall</button>
      <button data-tool="coin"><span class="dot" style="background:#fde047;border-radius:50%"></span>Coin</button>
      <button data-tool="enemy"><span class="dot" style="background:#ef4444"></span>Enemy</button>
      <button data-tool="goal"><span class="dot" style="background:#22c55e"></span>Goal</button>
      <button data-tool="actor"><span class="dot" style="background:#38bdf8"></span>Actor</button>
      <button data-tool="platform"><span class="dot" style="background:#8b5cf6"></span>Platform</button>
      <button data-tool="spikes"><span class="dot" style="background:#f97316"></span>Spikes</button>
      <button data-tool="spring"><span class="dot" style="background:#a3e635"></span>Spring</button>
      <button data-tool="key"><span class="dot" style="background:#fbbf24;border-radius:50%"></span>Key</button>
      <button data-tool="door"><span class="dot" style="background:#b45309"></span>Door</button>
      <button data-tool="sign"><span class="dot" style="background:#d6a35c"></span>Sign</button>
      <button data-tool="label"><span class="dot" style="background:#ffffff"></span>Label</button>
      <button data-tool="checkpoint"><span class="dot" style="background:#a78bfa"></span>Checkpoint</button>
      <button data-tool="decor"><span class="dot" style="background:#4ade80"></span>Decor</button>
      <button data-tool="eraser">🧽 Eraser</button>
      <p id="tool-desc"></p>
      <p style="margin-top:auto"><a class="back" href="../index.html">← FlockBuilder</a></p>
    </aside>
    <div id="center">
      <div id="room-tabs"></div>
      <div id="stage">
        <div id="board-wrap">
          <canvas id="board" width="960" height="540"></canvas>
          <div id="mode-banner">▶ Playing — ESC returns to the editor</div>
        </div>
      </div>
    </div>
    <aside id="props">
      <h2>Properties</h2>
      <div id="props-body"></div>
    </aside>
  </main>
  <input type="file" id="import-file" accept=".json,application/json" style="display:none">
  <div id="modal-back" class="modal-back" style="display:none">
    <div class="modal-wrap">
      <button id="modal-x" class="modal-x" title="Close">×</button>
      <div class="modal" id="modal-box"></div>
    </div>
  </div>
  <script type="module" src="./builder.js"></script>
</body>
</html>
